[settings]
lockfile = true

[tools]
bun = "1.3.13"
node = "24.20.0"

[tasks.setup]
description = "Install the project dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the development server"
run = "bun run dev"

[tasks.check]
description = "Run the local CI checks"
run = [
  "bun run format",
  "bun run lint",
  "bun run knip",
  "bun run typecheck",
  "bun run test",
  "bun run build",
]
